# CI for dsh-file-viewer
#
# Every push / PR: install → type-check → unit tests → build dist (node half +
# client bundle) → package the installable tarball → upload as artifact.
#
# Tag releases are handled by .github/workflows/release.yml (which attaches the
# built dist to a GitHub Release). This workflow deliberately does NOT run on
# v* tags so the two never race.
#
# `dist/` is committed so GitHub-source installs work when dependency build
# scripts are disabled. CI rebuilds it and rejects stale committed bundles.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: check · test · build · pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (strict, src + tests)
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build bundles (dist/index.js + dist/client.js)
        run: pnpm build

      - name: Verify committed bundles are current
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- dist)" ]; then
            git status --short --untracked-files=all -- dist
            exit 1
          fi

      - name: Package installable tarball
        run: pnpm pack --pack-destination dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-file-viewer-dist
          path: |
            dist/
            *.tgz
          retention-days: 14
