name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Validate version tag
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'

          const pkg = JSON.parse(await readFile('package.json', 'utf8'))
          const expectedTag = `v${pkg.version}`

          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Expected tag ${expectedTag}, received ${process.env.GITHUB_REF_NAME}`)
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: NODE_ENV=production pnpm build

      - name: Verify committed bundles are current
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- dist)" ]; then
            git status --short --untracked-files=all -- dist
            exit 1
          fi

      - name: Pack npm package
        run: |
          mkdir -p release-assets
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/release-assets"

      - name: Stage release checksums
        run: |
          cd release-assets
          sha256sum *.tgz > SHA256SUMS.txt

      - name: Publish npm package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_NAME="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")"
          echo "Checking if $PACKAGE_NAME@$VERSION already exists on npm..."
          if npm view "$PACKAGE_NAME"@"$VERSION" >/dev/null 2>&1; then
            echo "Version already exists on npm, skip publish."
          else
            npm publish --provenance --access public
          fi

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@liguobao'

      - name: Publish GitHub Packages npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          PACKAGE_NAME="@${OWNER}/dsh-file-viewer"
          echo "Checking if $PACKAGE_NAME@$VERSION already exists on GitHub Packages..."
          if npm view "$PACKAGE_NAME"@"$VERSION" --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Version already exists on GitHub Packages, skip publish."
            exit 0
          fi

          mkdir -p github-package
          tar -xzf "release-assets/dsh-file-viewer-$VERSION.tgz" -C github-package
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'

          const manifestPath = 'github-package/package/package.json'
          const pkg = JSON.parse(await readFile(manifestPath, 'utf8'))
          const owner = process.env.GITHUB_REPOSITORY_OWNER.toLowerCase()
          const unscopedName = pkg.name.replace(/^@[^/]+\//, '')
          pkg.name = `@${owner}/${unscopedName}`
          pkg.publishConfig = {
            ...(pkg.publishConfig ?? {}),
            registry: 'https://npm.pkg.github.com',
          }
          await writeFile(manifestPath, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

          npm publish ./github-package/package --ignore-scripts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
