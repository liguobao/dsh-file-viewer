name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Validate version tag
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'

          const pkg = JSON.parse(await readFile('package.json', 'utf8'))
          const expectedTag = `v${pkg.version}`

          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Expected tag ${expectedTag}, received ${process.env.GITHUB_REF_NAME}`)
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: NODE_ENV=production pnpm build

      - name: Pack npm package
        run: |
          mkdir -p release-assets
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/release-assets"

      - name: Stage release checksums
        run: |
          cd release-assets
          sha256sum *.tgz > SHA256SUMS.txt

      - name: Publish npm package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_NAME="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")"
          echo "Checking if $PACKAGE_NAME@$VERSION already exists on npm..."
          if npm view "$PACKAGE_NAME"@"$VERSION" >/dev/null 2>&1; then
            echo "Version already exists on npm, skip publish."
          else
            npm publish --provenance --access public
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DSH File Viewer ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
