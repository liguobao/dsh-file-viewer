; 应用配置（INI 格式）
[general]
app_name = Fruit Store
language = zh_CN
timezone = Asia/Shanghai
debug = false

[database]
host = localhost
port = 5432
user = app_user
password = ******
pool_size = 10

[logging]
level = INFO
file = /var/log/fruit-store/app.log
max_size_mb = 100
backup_count = 5

[cache]
enabled = true
backend = redis
ttl_seconds = 3600
